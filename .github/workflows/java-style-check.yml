name: Java Style Check

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write 

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Google Java Format
        uses: axel-op/googlejavaformat-action@v4
        with:
          args: "--aosp --replace" # AOSP 스타일로 포맷 (4칸 들여쓰기)
          commit-message: "fix style"

      - name: Commit and push formatted code to feature branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout ${{ github.head_ref }} # PR의 source branch (feature)
          git add .
          git commit -m "fix style" || echo "No changes to commit"
          git push origin ${{ github.head_ref }} || echo "Nothing to push"
