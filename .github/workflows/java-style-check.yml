name: Java Style Check

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write # commit과 push를 위해 write 권한 필요

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 기록을 가져와야 브랜치 푸시 가능
          
      - name: Run Google Java Format
        uses: axel-op/googlejavaformat-action@v4
        with:
          args: "--aosp --replace" # AOSP 스타일로 포맷 (4칸 들여쓰기)

